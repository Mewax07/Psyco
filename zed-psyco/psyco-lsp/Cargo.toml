[package]
name = "psyco-lsp"
version = "0.1.0"
edition = "2021"
publish = false
description = "Language server for Psyco, used by the Zed extension"

# Standalone crate: keep it out of the extension's build.
[workspace]

[dependencies]
lsp-server = "0.7"
lsp-types = "0.97"
serde = "1"
serde_json = "1"
psycoc = { path = "../../psycoc" }
